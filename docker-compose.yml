services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_DB_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_DATABASE}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DB_USERNAME} -d ${POSTGRES_DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: ./bot
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB_HOST: db
      API_URL: http://api:3001
    volumes:
      - bot-data:/app/data
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
  bot-data:
